name: Generate Git Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git Koi GIF
        uses: yalongwastaken/git-koi@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output: ./git-koi.gif

      - name: Commit and push output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Save the generated GIF temporarily outside the workspace checkout
          cp ./git-koi.gif /tmp/git-koi.gif

          # Switch to or create the orphan output branch
          if git ls-remote --exit-code --heads origin output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf .
          fi
          
          # Move the GIF back into the root of the output branch
          cp /tmp/git-koi.gif ./git-koi.gif
          git add git-koi.gif
          
          git commit -m "chore: update git-koi gif [skip ci]" || echo "No changes to commit"
          git push origin output
